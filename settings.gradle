pluginManagement {
    // gradle/shared is a git submodule providing the mcmod plugin. Fail early
    // and clearly when it is missing: includeBuild resolves before build.gradle
    // gets a chance to run its own check.
    if (!new File(settingsDir, 'gradle/shared/build.gradle').exists()) {
        throw new GradleException(
            "gradle/shared submodule is not initialized. Run: git submodule update --init")
    }
    includeBuild 'gradle/shared'
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.parchmentmc.org/' }
        // gradle/shared's mcmod plugin depends on com.github.Querz:NBT, which is
        // only published on JitPack (see MEMORY: Querz NBT requires JitPack).
        // Plugin classpath resolution for an includeBuild uses this repositories
        // block, not gradle/shared's own, so it must be listed here too.
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()
    }
}

// Enable automatic download of Java toolchains
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'chronodawn'

// Include version-specific common module based on target Minecraft version
// Default value is defined in gradle.properties (single source of truth)
if (!settings.hasProperty('target_mc_version')) {
    throw new GradleException("'target_mc_version' property is not defined. Check gradle.properties or pass -Ptarget_mc_version=<version>")
}
def targetMcVersion = settings.target_mc_version

// Map hotfix versions to their base version for module selection
// 1.21.3 is a hotfix of 1.21.2, sharing the same modules
def moduleVersion = targetMcVersion
if (targetMcVersion == '1.21.3') {
    moduleVersion = '1.21.2'
    logger.lifecycle("Note: 1.21.3 uses 1.21.2 modules (hotfix release)")
}

def commonProject = "common-${moduleVersion}"
include commonProject
project(":${commonProject}").projectDir = file("common/${moduleVersion}")
logger.lifecycle("Common module: ${commonProject} -> common/${moduleVersion}")

// Platform-specific projects
// Each version uses a separate directory (fabric/X.XX.X, neoforge/X.XX.X, forge/X.XX.X)
// so that .gradle/architectury/ paths don't conflict, enabling full parallel gameTest.
// Project names remain 'fabric'/'neoforge'/'forge' as required by Architectury Plugin.
// Enabled platforms come from props/<version>.properties' enabled_platforms key when
// present; versions that don't declare it keep today's fabric+neoforge behavior.
def platformsPropsFile = file("props/${targetMcVersion}.properties")
def enabledPlatforms = ['fabric', 'neoforge']
if (platformsPropsFile.exists()) {
    def platformProps = new Properties()
    platformsPropsFile.withInputStream { platformProps.load(it) }
    def declared = platformProps.getProperty('enabled_platforms')
    if (declared != null && !declared.trim().isEmpty()) {
        enabledPlatforms = declared.split(',').collect { it.trim() }.findAll { it }
    }
}
enabledPlatforms.each { platform ->
    include platform
    project(":${platform}").projectDir = file("${platform}/${moduleVersion}")
    logger.lifecycle("${platform.capitalize()} module: ${platform}/${moduleVersion}")
}
