apply from: rootProject.file('gradle/nbt-block-replacement.gradle')

architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/chronodawn.accesswidener")

    mixin {
        defaultRefmapName = "common-common-refmap.json"
    }
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // night-config (TOML config parser used by ChronoDawnConfig in common code).
    // Compile-only here; runtime is provided by NeoForge (transitively) and by
    // fabric/<version>/build.gradle's `include(...)` JAR-in-JAR for Fabric.
    compileOnly "com.electronwill.night-config:core:3.8.3"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
    // Tests (run outside the loader environments) need night-config on the
    // runtime classpath since neither NeoForge nor Fabric is present.
    testImplementation "com.electronwill.night-config:core:3.8.3"
    testImplementation "com.electronwill.night-config:toml:3.8.3"

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Mockito is used by ShieldEffectHandlerTest to stub LivingEntity without registry bootstrap
    // 26.2: Java 25 class files require a newer Byte Buddy than Mockito 5.11.0
    // bundles (5.11.0's Byte Buddy tops out at Java 22); 5.23.0 supports Java 25.
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../shared/src/main/java'
            // common/gametest compiles here via CompatGameTestHelper.fail(), which absorbs the
            // 1.21.5 GameTestHelper.fail(String) -> fail(Component) change.
            srcDir '../gametest/src/main/java'
        }
        // Use filter to exclude files from common/shared that have 1.21.5-specific versions
        // (1.21.5 has its own versions with different APIs)
        java.filter.exclude { element ->
            def path = element.file.absolutePath
            if (path.contains('common/gametest/')) {
                // FadedPlains tests are registered as @GameTest methods (Fabric) or Consumer
                // constants (NeoForge) from 1.21.5 on, so this version keeps its own copy.
                // 26.3: StructureManager.getStructureManager() renamed to
                // getStructureTemplateManager(), so this version keeps its own copy too.
                return element.file.name == 'FadedPlainsTests.java'
                    || element.file.name == 'StructureTests.java'
            }
            if (!path.contains('common/shared')) {
                return false
            }
            // List of files that have 1.21.5-specific versions
            def excludedFiles = [
                'BossSpawnData.java',
                'ClockTowerTeleporterBlockEntity.java',
                'BossRoomDoorBlockEntity.java',
                'TimeWheatBaleBlock.java',
                'TimeDistortionEffect.java',
                'ReversedResonance.java',
                'PortalRegistry.java',
                'PortalRegistryData.java',
                'ChronoDawnGlobalState.java',
                'DimensionStateData.java',
                'ChronoDawnTimeData.java',
                'TimeKeeperVillageData.java',
                'PlayerProgressData.java',
                // Mixins with 1.21.5-specific versions (isDay() method removed)
                'LevelGetTimeMixin.java',
                'ServerLevelSetTimeMixin.java',
                // 1.21.6: player.server became private, serverLevel() removed
                'PlayerEventHandler.java',
                // 1.21.9: TextureSheetParticle renamed to SingleQuadParticle
                'ChronoDawnPortalParticle.java',
                'ChronoShieldEchoParticle.java',
                // 1.21.9: getSharedSpawnPos() removed
                'ChronoDawnDimension.java',
                // 1.21.11: ResourceLocation renamed to Identifier
                'AncientTimeWoodTreeFeature.java',
                'ChronicleData.java',
                'NbtTemplateConfiguration.java',
                'NbtTemplateFeature.java',
                'ChronoShieldEffectHandler.java',
                'ChronoDawnBiomeProvider.java',
                'DarkTimeWoodTreeFeature.java',
                'DimensionStabilizer.java',
                'FruitOfTimeTreeFeature.java',
                'ModDimensions.java',
                'ModSounds.java',
                'PortalStateMachine.java',
                'BlockProtectionHandler.java',
                'PermanentProtectionHandler.java',
                // 26.2: same rename/API delta as 26.1.2 (see common/26.1.2/build.gradle)
                'FreezeTopLayerMixin.java',
                'GuiGraphicsShieldCdMixin.java',
                'TemporalGrassEdgeTint.java',
                'CobwebColorProvider.java',
                'TemporalPlantColorProvider.java',
                'SleepMixin.java',
                'TimeDistortionEventHandler.java',
                // 26.2: StructureProcessor became an interface, StructureProcessorType<P>
                // wrapper removed (Registries.STRUCTURE_PROCESSOR now registers MapCodec
                // directly) - not needed by 26.1.2
                'CopyFluidLevelProcessor.java',
                // 26.3: ComposterBlock.COMPOSTABLES removed; composting is now a
                // per-item DataComponent set at construction time (see ModComposting.java)
                'ModComposting.java'
            ]
            return excludedFiles.contains(element.file.name)
        }
        resources {
            srcDir "${buildDir}/generated/nbt-block-replaced"
            srcDir '../shared-1.21.5+/src/main/resources'
            srcDir '../shared-1.21.2+/src/main/resources'
            srcDir '../shared-1.21.1+/src/main/resources'
            srcDir '../shared/src/main/resources'
            // 26.1.2+: NeoForge's LootModifierManager no longer reads a replace/entries
            // manifest; it folder-scans every JSON under data/*/loot_modifiers/ and decodes
            // each directly via a "type"-dispatch codec. The old manifest file has no "type"
            // key and gets swept into that scan, so it now fails to parse. The mod's actual
            // modifier (data/chronodawn/loot_modifiers/grass_time_wheat_seed.json) is already
            // discovered by the folder scan on its own, so the manifest is obsolete here.
            exclude 'data/forge/loot_modifiers/global_loot_modifiers.json'
            exclude 'data/neoforge/loot_modifiers/global_loot_modifiers.json'
            // 26.3: BlockState references changed from {"Name": ..., "Properties": ...} to
            // a bare string or {"id": ..., "properties": ...}, Feature is no longer generic
            // (no more {"type":..,"config":{...}} wrapper, and the datapack directory moved
            // from worldgen/configured_feature to worldgen/feature), and several state
            // provider/placement modifier type ids dropped their "_state_provider"/
            // "_provider" suffix. This version keeps its own fixed copies of the shared
            // processor_list and configured_feature files. Only exclude the shared copies
            // (not this version's own src/main/resources copies).
            // 26.3 also renamed the recipe_unlocked criterion's "recipe" key to "recipes", so
            // the shared advancement/recipes files are replaced by this version's own copies.
            // Loot tables likewise: 26.3 drops the plural "conditions"/"functions" keys (silently
            // ignored, which made every conditional drop unconditional) in favor of a single
            // "condition" and "modifier", and renames the "condition"/"function" type keys to "type".
            filter.exclude { element ->
                def path = element.file.absolutePath
                def isWorldgenPack = path.contains('common/shared/') || path.contains('common/shared-1.21.1+/') || path.contains('common/shared-1.21.5+/')
                isWorldgenPack && (
                    path.contains('data/chronodawn/worldgen/processor_list/')
                    || path.contains('data/chronodawn/worldgen/configured_feature/')
                    || path.contains('data/chronodawn/worldgen/placed_feature/')
                    || path.contains('data/chronodawn/advancement/recipes/')
                    || path.contains('data/chronodawn/loot_table/')
                    || path.contains('data/chronodawn/loot_modifiers/')
                    || path.contains('data/minecraft/loot_table/')
                )
            }
        }
    }
    test {
        java {
            srcDir '../shared/src/test/java'
            // 26.3: NbtTemplateConfiguration was folded into the NbtTemplateFeature record, so
            // this version keeps its own equivalent test (src/test/java/.../NbtTemplateFeatureCodecTest).
            filter.exclude { element ->
                element.file.absolutePath.contains('common/shared/')
                    && element.file.name == 'NbtTemplateConfigurationCodecTest.java'
            }
        }
    }
}

// Set version info as Java system property at runtime (for compat handlers)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Achronodawn.minecraft.version=${project.ext.minecraft_version}"]
    doFirst {
        System.setProperty('chronodawn.minecraft.version', project.ext.minecraft_version as String)
    }
}

// Run NBT conversion before processing resources
processResources.dependsOn nbtStructures

// Expand pack_format variables in pack.mcmeta
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'pack_format', project.ext.pack_format
    inputs.property 'pack_format_min', project.ext.pack_format_min
    inputs.property 'pack_format_max', project.ext.pack_format_max

    filesMatching('pack.mcmeta') {
        expand 'pack_format': project.ext.pack_format,
               'pack_format_min': project.ext.pack_format_min,
               'pack_format_max': project.ext.pack_format_max
    }
}

tasks.test {
    useJUnitPlatform()

    // Pass Minecraft version to tests for multi-version resource path resolution
    systemProperty 'chronodawn.minecraft.version', project.ext.minecraft_version
    // Pass source directory for source-parsing based resource validation tests
    systemProperty 'chronodawn.source.dir', file('src/main/java').absolutePath
    systemProperty 'chronodawn.project.root', rootProject.projectDir.absolutePath
}

// Set duplicates strategy for sourcesJar to avoid conflicts
// Also ensure NBT conversion runs before sourcesJar
tasks.named('sourcesJar') {
    dependsOn nbtStructures
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
