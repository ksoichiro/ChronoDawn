# Chrono Dawn configuration.
#
# This file is read once at mod startup. Changes require a server (or
# single-player world) restart to take effect; /reload does NOT re-read
# this file. Already-generated chunks are not retroactively updated;
# new values apply only to chunks generated after the change.
#
# Invalid values fall back to defaults for that field. Unknown keys are
# ignored (with a warning in the log). To restore defaults for any
# field, delete the line; this file is overwritten only when missing.

schema_version = 1

[world.structures.ancient_ruins]
# Whether Ancient Ruins generate at all in the Overworld.
enabled = true

# Average distance (in chunks) between Ancient Ruins placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 56

# Minimum guaranteed distance (in chunks) between two Ancient Ruins.
# Must be < spacing.
separation = 20

# Random seed offset for placement; usually no reason to change this.
salt = 20005897

[world.structures.forgotten_library]
# Whether the Forgotten Library generates in Chrono Dawn.
# Disabling it removes the Portal Stabilizer recipe from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 30

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 15

# Random seed offset for placement; usually no reason to change this.
salt = 8735421890

[world.structures.desert_clock_tower]
# Whether the Desert Clock Tower generates in Chrono Dawn.
# Disabling it removes access to the Time Guardian, the Master Clock Key and Enhanced Clockstone from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 30

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 10

# Random seed offset for placement; usually no reason to change this.
salt = 1663542342

[world.structures.guardian_vault]
# Whether the Guardian Vault generates in Chrono Dawn.
# Disabling it removes access to Chronos Warden and the Guardian Stone from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 48

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 24

# Random seed offset for placement; usually no reason to change this.
salt = 928374651

[world.structures.clockwork_depths]
# Whether the Clockwork Depths generates in Chrono Dawn.
# Disabling it removes access to Clockwork Colossus and the Colossus Gear from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 56

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 28

# Random seed offset for placement; usually no reason to change this.
salt = 837465129

[world.structures.phantom_catacombs]
# Whether the Phantom Catacombs generates in Chrono Dawn.
# Disabling it removes access to Temporal Phantom and the Phantom Essence from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 20

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 8

# Random seed offset for placement; usually no reason to change this.
salt = 745182936

[world.structures.entropy_crypt]
# Whether the Entropy Crypt generates in Chrono Dawn.
# Disabling it removes access to Entropy Keeper and the Entropy Core from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 50

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 25

# Random seed offset for placement; usually no reason to change this.
salt = 738291456

[world.structures.master_clock]
# Whether the Master Clock generates in Chrono Dawn.
# Disabling it removes access to Time Tyrant, the final boss from world generation.
enabled = true

# Average distance (in chunks) between placement attempts.
# Lower = denser, higher = rarer. Must be > separation. Vanilla limit: 4096.
spacing = 60

# Minimum guaranteed distance (in chunks) between two placements.
# Must be < spacing.
separation = 20

# Random seed offset for placement; usually no reason to change this.
salt = 1234567890

[world.ores.time_crystal]
# Whether Time Crystal ore generates in the Chrono dimension.
enabled = true

# Number of placement attempts per chunk. Lower = rarer, higher = denser.
# Each attempt generates one cluster (cluster size is fixed at the data-pack level).
count = 3

# Minimum and maximum Y level (absolute) where Time Crystal ore can spawn.
# The distribution between min and max is biased toward the middle (trapezoid).
y_min = 0
y_max = 48

[world.ores.entropy_crystal]
# Whether Entropy Crystal ore generates.
enabled = true

count = 4
y_min = 40
y_max = 100

[world.ores.temporal_amber]
# Whether Temporal Amber ore generates.
enabled = true

# Temporal Amber uses a uniform distribution (flat probability across the Y range)
# rather than trapezoid; tune y_min/y_max accordingly.
count = 4
y_min = -30
y_max = 20

[world.ores.clockstone]
# Whether Clockstone Ore generates in the Chrono dimension.
enabled = true

# Number of placement attempts per chunk. Lower = rarer, higher = denser.
# Each attempt generates one cluster (cluster size is fixed at the data-pack level).
count = 8

# Minimum and maximum Y level (absolute) where Clockstone Ore can spawn.
# Distribution between min and max is biased toward the middle (trapezoid).
y_min = -16
y_max = 80

[gameplay.time_distortion]
# Whether the Chrono Dawn dimension applies ambient Slowness to mobs.
enabled = true

# Slowness level before and after the Eye of Chronos enhancement. Range: 1 to 5.
normal_slowness_level = 4
enhanced_slowness_level = 5

# "hostile_mobs" affects only hostile mobs. "all_mobs" also affects passive
# and friendly mobs. Players and Chrono Dawn bosses are never affected.
scope = "hostile_mobs"

[gameplay.portals]
# Whether entering Chrono Dawn deactivates the departure portal and destroys
# the arrival portal until the Portal Stabilizer has been used.
one_way_until_stabilized = true

# When one_way_until_stabilized is true, whether Time Hourglass may ignite a
# portal in Chrono Dawn before the Portal Stabilizer is used.
allow_reignition_before_stabilization = false

[gameplay.bosses.time_guardian]
# Scales the boss's maximum health. 2.0 = double health. Range: 0.1 to 10.0.
health_multiplier = 1.0

# Scales this boss's direct damage: melee, its area-of-effect attack,
# and the Time Blast projectile it fires. Does NOT scale the Slowness /
# Mining Fatigue debuffs it applies — a MobEffect amplifier is an
# integer and cannot express a fractional multiplier. Range: 0.0 to 10.0.
damage_multiplier = 1.0

[gameplay.bosses.chronos_warden]
health_multiplier = 1.0
damage_multiplier = 1.0

[gameplay.bosses.clockwork_colossus]
health_multiplier = 1.0
damage_multiplier = 1.0

[gameplay.bosses.entropy_keeper]
health_multiplier = 1.0
damage_multiplier = 1.0

[gameplay.bosses.temporal_phantom]
health_multiplier = 1.0
damage_multiplier = 1.0

[gameplay.bosses.time_tyrant]
health_multiplier = 1.0
damage_multiplier = 1.0
