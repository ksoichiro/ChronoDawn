plugins {
    id 'com.github.ksoichiro.mcmod'
}

apply from: rootProject.file('gradle/nbt-block-replacement.gradle')

architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    mixin {
        defaultRefmapName = "common-common-refmap.json"
    }
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // night-config (TOML config parser used by ChronoDawnConfig in common code).
    // Compile-only here; runtime is provided by Forge (transitively) and by
    // fabric/<version>/build.gradle's `include(...)` JAR-in-JAR for Fabric.
    compileOnly "com.electronwill.night-config:core:3.8.3"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
    // Tests (run outside the loader environments) need night-config on the
    // runtime classpath since neither loader is present.
    testImplementation "com.electronwill.night-config:core:3.8.3"
    testImplementation "com.electronwill.night-config:toml:3.8.3"

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../shared/src/main/java'
            srcDir '../gametest/src/main/java'
        }
        // Use filter to exclude files from common/shared that have 1.20.1-specific versions.
        // Era C (1.20.1) uses raw MobEffect (not Holder<MobEffect>) for MobEffectInstance,
        // and also uses the OLD MobEffects constant names (MOVEMENT_SLOWDOWN / DIG_SLOWDOWN /
        // MOVEMENT_SPEED) — the shared copy uses SLOWNESS / MINING_FATIGUE / SPEED for Era A.
        java.filter.exclude { element ->
            if (!element.file.absolutePath.contains('common/shared')) {
                return false
            }
            def excludedFiles = [
                'ChronoShieldEffectHandler.java',
                // 1.20.1 predates CustomPacketPayload; networking uses Architectury 9.x
                // FriendlyByteBuf-based API (see common/1.20.1/.../network/).
                'S2CShieldCooldownPayload.java',
                'ModNetworking.java',
                // 1.20.1, 1.21.1-1.21.4: fill() needs z=200 to render overlay on top of items
                'GuiGraphicsShieldCdMixin.java'
            ]
            return excludedFiles.contains(element.file.name)
        }
        resources {
            srcDir '../shared/src/main/resources'
            srcDir "${buildDir}/generated/nbt-structures"
        }
    }
    test {
        java {
            srcDir '../shared/src/test/java'
        }
    }
}

// Set version info as Java system property at runtime (for compat handlers)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Achronodawn.minecraft.version=${project.ext.minecraft_version}"]
    doFirst {
        System.setProperty('chronodawn.minecraft.version', project.ext.minecraft_version as String)
    }
}

// NBT Structure Multi-Version Conversion
// Converts 1.21.1 NBT structure files to 1.20.1 format. The conversion runs on
// the JVM inside the shared mcmod plugin; only nbtConversion is enabled here
// because multiVersion and resourceValidation already come from the script
// plugins applied in the root build, and both default to enabled.
mcmod {
    multiVersion {
        enabled = false
    }
    resourceValidation {
        enabled = false
    }
    nbtConversion {
        enabled = true
        sourceVersion = '1.21.1'
        targetVersion = '1.20.1'
        inputDir = "${buildDir}/generated/nbt-block-replaced/data/chronodawn/structure"
        outputDir = "${buildDir}/generated/nbt-structures/data/chronodawn/structures"
    }
}

// convertNbt is registered lazily by the mcmod plugin inside its own
// project.afterEvaluate block, so it does not exist in the task container yet
// at this point in script evaluation. Deferring to our own afterEvaluate (which
// Gradle runs after the plugin's, since afterEvaluate blocks fire in
// registration order) lets us reference it safely.
project.afterEvaluate {
    tasks.named('convertNbt') {
        dependsOn 'replaceNbtBlocks'
    }

    tasks.named('nbtStructures') {
        dependsOn 'convertNbt'
    }
}

// Run NBT conversion before processing resources
processResources.dependsOn nbtStructures

// Expand pack_format variable in pack.mcmeta
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'pack_format', project.ext.pack_format

    filesMatching('pack.mcmeta') {
        expand 'pack_format': project.ext.pack_format
    }
}

tasks.test {
    useJUnitPlatform()

    // Pass Minecraft version to tests for multi-version resource path resolution
    systemProperty 'chronodawn.minecraft.version', project.ext.minecraft_version
    // Pass source directory for source-parsing based resource validation tests
    systemProperty 'chronodawn.source.dir', file('src/main/java').absolutePath
    systemProperty 'chronodawn.project.root', rootProject.projectDir.absolutePath
}

// Set duplicates strategy for sourcesJar to avoid conflicts
// Also ensure NBT conversion runs before sourcesJar
tasks.named('sourcesJar') {
    dependsOn nbtStructures
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
