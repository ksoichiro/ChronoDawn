name: CI

# Actions are pinned to commit SHAs and the runner to a fixed image, so a new
# release or a runner-label migration cannot change the build unnoticed.
# Update the actions with `pinact run -u` and the runner by editing runs-on.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Keep every main run so that each pushed commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # On JDK 25 the Gradle launcher prints restricted-method warnings when its
  # native-platform library calls System.load, unless native access is enabled.
  JAVA_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  validate:
    name: Validate resources and data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # setup-gradle saves its cache only on main, and pull requests read it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Only English is required here. Missing translations in other
      # locales are reported as warnings, and checkAll keeps them required.
      # validation_only skips the version subprojects, so Loom does not set
      # up Minecraft for checks that only read files.
      - run: ./gradlew validateAll -Plang_required_locales=en_us -Pvalidation_only=true

  build:
    name: Build and unit test (${{ matrix.mc }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 1.21.1 carries most players and modpacks, 26.3 is the default target.
        mc: ['1.21.1', '26.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build -Ptarget_mc_version=${{ matrix.mc }}
