# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version=0.8.0
maven_group=com.chronodawn
archives_name=chronodawn
enabled_platforms=fabric,neoforge

# Minecraft properties
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.1
target_mc_version=1.21.11

# Dependencies
architectury_api_version=13.0.8
fabric_loader_version=0.17.3
fabric_api_version=0.116.7+1.21.1
neoforge_version=21.1.209
yarn_mappings_patch_neoforge_version=1.21+build.4

# Release properties
modrinth_project_id=yEsoyNev
curseforge_project_id=1414198
release_project_name=Chrono Dawn

# Multi-version configuration
supported_mc_versions=1.20.1,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11
hotfix_mc_versions=1.21.3=1.21.2
fabric_only_mc_versions=1.20.1

# ID enum files consumed by validateTranslations (submodule) and
# validateData (submodule): single source of truth for registered IDs.
entity_id_file=common/shared/src/main/java/com/chronodawn/registry/ModEntityId.java
item_id_file=common/shared/src/main/java/com/chronodawn/registry/ModItemId.java
block_id_file=common/shared/src/main/java/com/chronodawn/registry/ModBlockId.java

# Resource roots that must carry assets/chronodawn/items/<id>.json for every
# item-form ID (1.21.4+ client item definitions; missing file = purple-black icon).
client_items_roots=common/1.21.4/src/main/resources,common/shared-1.21.5+/src/main/resources

# Basenames exempt from the client items check: these models/item/*.json files
# are variant/template models referenced from another item's own client item
# JSON (via minecraft:condition or as a model parent), not standalone items.
# - clockstone_shield_blocking, enhanced_clockstone_shield_blocking,
#   entropy_crystal_shield_blocking: shield "using_item" blocking pose,
#   selected inside the base shield's own items/<id>.json
# - template_spawn_egg: base model parent reused by every *_spawn_egg.json
#   model (pre-1.21.4 layered icon), not an item itself
client_items_excluded_ids=clockstone_shield_blocking,enhanced_clockstone_shield_blocking,entropy_crystal_shield_blocking,template_spawn_egg

# Technical entities excluded from translation validation: in-flight
# projectile entities are never shown to the player with a name tag
# (same as vanilla arrows/snowballs), so they need no entity.chronodawn.*
# translation key.
# - gear_projectile: Clockwork Colossus boss's thrown gear projectile
# - time_arrow: the in-flight arrow spawned by the Time Arrow item
#   (the item itself already has its own item.chronodawn.time_arrow key)
excluded_entities=gear_projectile,time_arrow

# Project-specific validation tasks to run inside checkAll (between
# validateTranslations and buildAll). Defined in gradle/chronodawn-validation.gradle,
# except validateData (gradle/shared/data-validation.gradle).
checkall_extra_tasks=validateLangParity,validateBlockTagMembership,validateRecipeUnlockAdvancements,validateEraJsonFormat,validateData
